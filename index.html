<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Asistio</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png">
<script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.top{background:#111827;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{font-size:23px;font-weight:850}.sub{font-size:12px;color:#cbd5e1}.wrap{max-width:1150px;margin:auto;padding:18px}.login{max-width:430px;margin:8vh auto}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 4px #0002;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;border:1px solid #e5e7eb;border-radius:14px}.stat b{font-size:28px;display:block}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.btn,.nav button{border:0;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.primary,.nav button.on{background:#111827;color:#fff}.ghost,.nav button{background:#fff}.danger{background:#b91c1c;color:#fff}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:160px}label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin:0 0 5px}input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;background:#fff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:14px}.muted{color:#6b7280}.ok{color:#047857;font-weight:800}.bad{color:#b91c1c;font-weight:800}.pill{padding:4px 8px;border-radius:999px;background:#e5e7eb;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.msg{padding:11px;border-radius:9px;margin:10px 0;background:#eff6ff}.error{background:#fef2f2;color:#991b1b}.footer{text-align:center;color:#6b7280;font-size:12px;padding:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:10px}th,td{font-size:12px;padding:8px 5px}.top{padding:12px}}
</style></head><body>
<header class="top"><div><div class="brand">Asistio</div><div class="sub">Asistencia escolar online</div></div><div id="who" class="sub"></div></header>
<main class="wrap"><div id="app"></div></main><div class="footer">Asistio v0.3 Online · Supabase</div>
<script>
const C=window.ASISTIO_CONFIG||{};let sb=null,user=null,memberships=[],school=null,page='inicio';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function configured(){return C.SUPABASE_URL&&C.SUPABASE_PUBLISHABLE_KEY&&!C.SUPABASE_URL.includes('PEGA_AQUI')&&!C.SUPABASE_PUBLISHABLE_KEY.includes('PEGA_AQUI')}
function msg(t,bad=false){return `<div class="msg ${bad?'error':''}">${esc(t)}</div>`}
async function boot(){if(!configured()){app.innerHTML=`<div class="login card"><h2>Falta configurar Supabase</h2><p>Abre <b>config.js</b> y pega Project URL + Publishable key.</p></div>`;return}sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY);const {data}=await sb.auth.getSession();if(data.session){user=data.session.user;await loadContext()}else login();sb.auth.onAuthStateChange(async(e,s)=>{if(e==='SIGNED_OUT'){user=null;memberships=[];school=null;login()}})}
function login(err=''){who.textContent='';app.innerHTML=`<div class="login card"><h1>Iniciar sesión</h1><p class="muted">Ingresa con tu cuenta Asistio.</p>${err?msg(err,true):''}<form onsubmit="doLogin(event)"><div class="field"><label>Correo</label><input id="email" type="email" autocomplete="username" required></div><br><div class="field"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password" required></div><br><button class="btn primary" style="width:100%">Ingresar</button></form></div>`}
async function doLogin(e){e.preventDefault();let b=e.submitter;b.disabled=true;b.textContent='Ingresando...';const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(error){login(error.message);return}user=data.user;await loadContext()}
async function loadContext(){const {data,error}=await sb.from('school_members').select('school_id,role,active,schools(id,name,code,active)').eq('user_id',user.id).eq('active',true);if(error){login('No se pudo cargar el perfil: '+error.message);return}memberships=data||[];if(!memberships.length){await sb.auth.signOut();login('Tu usuario no tiene una membresía activa en Asistio.');return}school=memberships[0].schools;page='inicio';render()}
function isSuper(){return memberships.some(m=>m.role==='superadmin')};function role(){return isSuper()?'superadmin':(memberships.find(m=>m.school_id===school?.id)?.role||memberships[0].role)}
function nav(){let p=[['inicio','Inicio']];if(isSuper())p.push(['colegios','Colegios']);p.push(['alumnos','Alumnos']);return `<nav class="nav">${p.map(x=>`<button class="${page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}<button onclick="logout()">Cerrar sesión</button></nav>`}
function shell(body){who.textContent=`${user.email} · ${role()}`;app.innerHTML=nav()+body}
function go(p){page=p;render()};function render(){if(page==='inicio')home();else if(page==='colegios')schoolsPage();else if(page==='alumnos')studentsPage()}
async function home(){let sc=0,st=0;if(isSuper()){let r=await sb.from('schools').select('*',{count:'exact',head:true});sc=r.count||0}else sc=1;if(school){let r=await sb.from('students').select('*',{count:'exact',head:true}).eq('school_id',school.id).eq('active',true);st=r.count||0}shell(`<div class="card"><div class="row"><div style="flex:1"><h2>Dashboard</h2><div class="muted">${esc(school?.name||'Sin colegio seleccionado')}</div></div>${isSuper()?'<button class="btn ghost" onclick="chooseSchool()">Cambiar colegio</button>':''}</div></div><div class="grid"><div class="stat"><span class="muted">Rol</span><b style="font-size:20px">${esc(role())}</b></div><div class="stat"><span class="muted">Colegios</span><b>${sc}</b></div><div class="stat"><span class="muted">Alumnos activos</span><b>${st}</b></div></div><div class="card"><h3>Asistio Online</h3><p>La sesión y los datos ya se obtienen desde Supabase. Este piloto permite validar autenticación, colegios y alumnos antes de incorporar cursos y asistencia QR.</p></div>`)}
async function chooseSchool(){const {data,error}=await sb.from('schools').select('id,name,code,active').eq('active',true).order('name');if(error)return alert(error.message);let opts=data.map((s,i)=>`${i+1}. ${s.name}`).join('\n'),n=prompt('Selecciona colegio:\n'+opts);let x=data[Number(n)-1];if(x){school=x;render()}}
async function schoolsPage(){if(!isSuper())return go('inicio');const {data,error}=await sb.from('schools').select('id,name,code,commune,email,active,created_at').order('name');if(error)return shell(msg(error.message,true));let rows=data.map(s=>`<tr><td><b>${esc(s.name)}</b><br><span class="muted">${esc(s.code||'')}</span></td><td>${esc(s.commune||'')}</td><td>${esc(s.email||'')}</td><td>${s.active?'<span class="ok">Activo</span>':'Inactivo'}</td><td><button class="btn ghost" onclick="editSchool('${s.id}')">Editar</button> <button class="btn ghost" onclick="selectSchool('${s.id}')">Usar</button></td></tr>`).join('');shell(`<div class="card"><div class="row"><div style="flex:1"><h2>Colegios</h2><span class="muted">${data.length} registros</span></div><button class="btn primary" onclick="editSchool()">+ Nuevo colegio</button></div></div><div class="card" style="overflow:auto"><table><tr><th>Colegio</th><th>Comuna</th><th>Email</th><th>Estado</th><th></th></tr>${rows}</table></div>`)}
async function editSchool(id=''){let s={name:'',code:'',commune:'',email:'',active:true};if(id){let r=await sb.from('schools').select('*').eq('id',id).single();if(r.error)return alert(r.error.message);s=r.data}let name=prompt('Nombre del colegio:',s.name);if(name===null||!name.trim())return;let code=prompt('Código interno:',s.code||'');if(code===null)return;let commune=prompt('Comuna:',s.commune||'');if(commune===null)return;let email=prompt('Email:',s.email||'');if(email===null)return;let payload={name:name.trim(),code:code.trim()||null,commune:commune.trim()||null,email:email.trim()||null,active:true};let r=id?await sb.from('schools').update(payload).eq('id',id):await sb.from('schools').insert(payload);if(r.error)return alert(r.error.message);schoolsPage()}
async function selectSchool(id){let r=await sb.from('schools').select('id,name,code,active').eq('id',id).single();if(!r.error){school=r.data;page='inicio';render()}}
async function studentsPage(){if(!school)return shell(`<div class="card"><h2>Alumnos</h2>${msg('Selecciona primero un colegio.')}</div>`);const {data,error}=await sb.from('students').select('id,rut,first_name,last_name,second_last_name,student_number,active,created_at').eq('school_id',school.id).order('last_name');if(error)return shell(msg(error.message,true));let rows=data.map(s=>`<tr><td><b>${esc(s.last_name)} ${esc(s.second_last_name||'')}, ${esc(s.first_name)}</b><br><span class="muted">${esc(s.id)}</span></td><td>${esc(s.rut||'')}</td><td>${esc(s.student_number||'')}</td><td>${s.active?'<span class="ok">Activo</span>':'Inactivo'}</td><td><button class="btn ghost" onclick="editStudent('${s.id}')">Editar</button></td></tr>`).join('');shell(`<div class="card"><div class="row"><div style="flex:1"><h2>Alumnos</h2><div class="muted">${esc(school.name)} · ${data.length} registros</div></div><button class="btn primary" onclick="editStudent()">+ Nuevo alumno</button></div></div><div class="card" style="overflow:auto"><table><tr><th>Alumno</th><th>RUT</th><th>N°</th><th>Estado</th><th></th></tr>${rows||'<tr><td colspan="5">Sin alumnos.</td></tr>'}</table></div>`)}
async function editStudent(id=''){let s={first_name:'',last_name:'',second_last_name:'',rut:'',student_number:'',active:true};if(id){let r=await sb.from('students').select('*').eq('id',id).single();if(r.error)return alert(r.error.message);s=r.data}let first=prompt('Nombres:',s.first_name);if(first===null||!first.trim())return;let last=prompt('Apellido paterno:',s.last_name);if(last===null||!last.trim())return;let second=prompt('Apellido materno:',s.second_last_name||'');if(second===null)return;let rut=prompt('RUT (opcional):',s.rut||'');if(rut===null)return;let num=prompt('Número/ID institucional (opcional):',s.student_number||'');if(num===null)return;let payload={school_id:school.id,first_name:first.trim(),last_name:last.trim(),second_last_name:second.trim()||null,rut:rut.trim()||null,student_number:num.trim()||null,active:true};let r=id?await sb.from('students').update(payload).eq('id',id):await sb.from('students').insert(payload);if(r.error)return alert(r.error.message);studentsPage()}
async function logout(){await sb.auth.signOut()}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));boot();
</script></body></html>
