<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Asistio</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.top{background:#111827;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.brand{font-size:22px;font-weight:800}.sub{font-size:12px;color:#cbd5e1}.wrap{max-width:1100px;margin:auto;padding:18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.nav button,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.nav button{background:#fff}.nav button.on,.primary{background:#111827;color:#fff}.danger{background:#b91c1c;color:#fff}.ghost{background:#e5e7eb}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 3px #0002;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;border:1px solid #e5e7eb;border-radius:14px}.stat b{font-size:28px;display:block}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:160px}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#4b5563}input,select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:#fff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:14px}.muted{color:#6b7280}.ok{color:#047857;font-weight:800}.warn{color:#b45309;font-weight:800}.bad{color:#b91c1c;font-weight:800}.hidden{display:none!important}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e5e7eb;font-size:12px}.scanner{max-width:520px;margin:12px auto}.notice{padding:12px;border-radius:10px;background:#eff6ff;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.qrbox{display:inline-block;padding:12px;background:white;border:1px solid #ddd}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal>.card{width:min(520px,100%);max-height:90vh;overflow:auto}.bigresult{text-align:center;font-size:20px;padding:12px}.courseList{display:flex;gap:8px;flex-wrap:wrap}.courseChip{padding:8px 10px;background:#eef2ff;border-radius:9px}.footer{text-align:center;color:#6b7280;font-size:12px;padding:25px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.top{padding:12px}.hide-mobile{display:none}th,td{padding:8px 5px;font-size:12px}}
</style></head><body>
<header class="top"><div><div class="brand">Asistio</div><div class="sub">Asistencia QR local y offline-first</div></div><div id="schoolTop" class="sub"></div></header>
<main class="wrap"><nav class="nav" id="nav"></nav><div id="app"></div></main><div class="footer">Asistio v0.2 PWA · datos guardados localmente en este dispositivo</div><div id="modal" class="hidden"></div>
<script>
const K={students:'asistio_students',sessions:'asistio_sessions',cfg:'asistio_cfg'};
let students=JSON.parse(localStorage.getItem(K.students)||'[]'),sessions=JSON.parse(localStorage.getItem(K.sessions)||'[]'),cfg=JSON.parse(localStorage.getItem(K.cfg)||'{"school":"Mi Colegio","year":2026,"late":10,"subjects":["Lenguaje","Matemática","Historia","Ciencias","Inglés","Otra"]}');
let current=null,scanner=null;const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function save(){localStorage.setItem(K.students,JSON.stringify(students));localStorage.setItem(K.sessions,JSON.stringify(sessions));localStorage.setItem(K.cfg,JSON.stringify(cfg));$('#schoolTop').textContent=cfg.school+' · '+cfg.year}
const pages=[['inicio','Inicio'],['alumnos','Alumnos y QR'],['asistencia','Tomar asistencia'],['historial','Historial'],['datos','Importar / Exportar'],['config','Configuración']];let page='inicio';
function nav(){ $('#nav').innerHTML=pages.map(p=>`<button class="${page===p[0]?'on':''}" onclick="go('${p[0]}')">${p[1]}</button>`).join('') }
function go(p){stopScan();page=p;nav();render()}
function courses(){return [...new Set(students.filter(x=>x.active!==false).map(x=>x.course).filter(Boolean))].sort()}
function uid(){return 'LST-'+cfg.year+'-'+crypto.randomUUID().slice(0,8).toUpperCase()}
function render(){save(); if(page==='inicio') home();if(page==='alumnos') alumnos();if(page==='asistencia') asistencia();if(page==='historial') historial();if(page==='datos') datos();if(page==='config') config()}
function home(){let today=new Date().toISOString().slice(0,10),ts=sessions.filter(s=>s.date===today).length;$('#app').innerHTML=`<div class="grid"><div class="stat"><span class="muted">Alumnos activos</span><b>${students.filter(s=>s.active!==false).length}</b></div><div class="stat"><span class="muted">Cursos</span><b>${courses().length}</b></div><div class="stat"><span class="muted">Asistencias hoy</span><b>${ts}</b></div></div><div class="card"><h2>Tomar asistencia</h2><p class="muted">Selecciona un curso, inicia una sesión y registra alumnos mediante QR o búsqueda manual.</p><button class="btn primary" onclick="go('asistencia')">Nueva asistencia</button></div><div class="card"><h3>Base institucional</h3><p>${esc(cfg.school)} · Año ${cfg.year}</p><div class="courseList">${courses().map(c=>`<span class="courseChip">${esc(c)} · ${students.filter(s=>s.course===c&&s.active!==false).length}</span>`).join('')||'<span class="muted">Aún no hay cursos. Agrega alumnos o importa una base.</span>'}</div></div>`}
function alumnos(){let rows=students.map((s,i)=>`<tr><td>${esc(s.list||'')}</td><td><b>${esc(s.name)}</b><br><span class="muted">${esc(s.id)}</span></td><td>${esc(s.rut||'')}</td><td>${esc(s.course)}</td><td>${s.active===false?'<span class="bad">Inactivo</span>':'<span class="ok">Activo</span>'}</td><td><button class="btn ghost" onclick="showQR(${i})">QR</button> <button class="btn ghost" onclick="editStudent(${i})">Editar</button></td></tr>`).join('');$('#app').innerHTML=`<div class="card"><div class="row"><div style="flex:1"><h2>Alumnos</h2><div class="muted">${students.length} registros en la base local</div></div><button class="btn primary" onclick="editStudent(-1)">+ Agregar alumno</button></div></div><div class="card" style="overflow:auto"><table><thead><tr><th>N°</th><th>Alumno / ID</th><th>RUT</th><th>Curso</th><th>Estado</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=6>No hay alumnos.</td></tr>'}</tbody></table></div>`}
function editStudent(i){let s=i>=0?students[i]:{id:uid(),name:'',rut:'',course:'',list:'',active:true};modal(`<h2>${i>=0?'Editar':'Nuevo'} alumno</h2><div class="field"><label>ID Asistio</label><input id="sid" value="${esc(s.id)}" readonly></div><div class="field"><label>Nombre completo</label><input id="sname" value="${esc(s.name)}"></div><div class="field"><label>RUT</label><input id="srut" value="${esc(s.rut)}"></div><div class="row"><div class="field"><label>Curso</label><input id="scourse" value="${esc(s.course)}" placeholder="1° Medio A"></div><div class="field"><label>N° lista</label><input id="slist" value="${esc(s.list)}"></div></div><div class="field"><label><input id="sactive" type="checkbox" style="width:auto" ${s.active!==false?'checked':''}> Alumno activo</label></div><div class="actions"><button class="btn primary" onclick="saveStudent(${i})">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveStudent(i){let s={id:$('#sid').value,name:$('#sname').value.trim(),rut:$('#srut').value.trim(),course:$('#scourse').value.trim(),list:$('#slist').value.trim(),active:$('#sactive').checked};if(!s.name||!s.course)return alert('Nombre y curso son obligatorios.');if(i>=0)students[i]=s;else students.push(s);closeModal();render()}
function showQR(i){let s=students[i];modal(`<h2>${esc(s.name)}</h2><p>${esc(s.course)} · ${esc(s.id)}</p><div id="qr" class="qrbox"></div><p class="muted">El QR contiene únicamente el ID Asistio.</p><div class="actions"><button class="btn" onclick="window.print()">Imprimir</button><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>`);if(window.QRCode)new QRCode($('#qr'),{text:s.id,width:220,height:220});else $('#qr').innerHTML='<b>No se cargó el generador QR. Conéctate una vez a Internet y recarga.</b>'}
function asistencia(){if(current)return sessionUI();let opts=courses().map(c=>`<option>${esc(c)}</option>`).join(''),subs=cfg.subjects.map(s=>`<option>${esc(s)}</option>`).join('');$('#app').innerHTML=`<div class="card"><h2>Nueva asistencia</h2><div class="row"><div class="field"><label>Curso</label><select id="acourse">${opts}</select></div><div class="field"><label>Asignatura</label><select id="asub">${subs}</select></div><div class="field"><label>Bloque</label><input id="ablock" placeholder="3-4"></div><div class="field"><label>Fecha</label><input id="adate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><br><button class="btn primary" onclick="startSession()" ${courses().length?'':'disabled'}>Iniciar asistencia</button>${courses().length?'':'<p class="warn">Primero debes agregar o importar alumnos.</p>'}</div>`}
function startSession(){let c=$('#acourse').value;current={id:crypto.randomUUID(),course:c,subject:$('#asub').value,block:$('#ablock').value,date:$('#adate').value,start:new Date().toISOString(),closed:false,records:{}};sessionUI()}
function sessionUI(){let list=students.filter(s=>s.course===current.course&&s.active!==false), rec=Object.values(current.records), present=rec.filter(r=>r.status==='Presente').length,late=rec.filter(r=>r.status==='Atrasado').length;$('#app').innerHTML=`<div class="card"><div class="row"><div style="flex:1"><h2>${esc(current.course)} · ${esc(current.subject)}</h2><div class="muted">${esc(current.date)} · Bloque ${esc(current.block||'-')}</div></div><div><b style="font-size:28px">${rec.length}/${list.length}</b><div class="muted">registrados</div></div></div><div class="grid" style="margin-top:12px"><div class="stat"><b>${present}</b>Presentes</div><div class="stat"><b>${late}</b>Atrasados</div><div class="stat"><b>${list.length-rec.length}</b>Pendientes</div></div></div><div class="card"><div class="actions"><button class="btn primary" onclick="startScan()">📷 Escanear QR</button><button class="btn ghost" onclick="manualAdd()">Registro manual</button><button class="btn danger" onclick="closeSession()">Cerrar asistencia</button></div><div id="reader" class="scanner"></div><div id="scanResult"></div></div><div class="card" style="overflow:auto"><h3>Lista del curso</h3><table><thead><tr><th>N°</th><th>Alumno</th><th>Estado</th><th>Hora</th><th></th></tr></thead><tbody>${list.map(s=>{let r=current.records[s.id];return `<tr><td>${esc(s.list)}</td><td>${esc(s.name)}</td><td>${r?`<span class="${r.status==='Atrasado'?'warn':'ok'}">${r.status}</span>`:'<span class="muted">Pendiente</span>'}</td><td>${r?esc(r.time):'-'}</td><td>${r?`<button class="btn ghost" onclick="removeRecord('${s.id}')">Quitar</button>`:`<button class="btn ghost" onclick="register('${s.id}','manual')">Marcar</button>`}</td></tr>`}).join('')}</tbody></table></div>`}
function startScan(){if(scanner)return;if(!window.Html5Qrcode){alert('El componente de cámara no está disponible. Conéctate una vez a Internet y recarga. También puedes usar Registro manual.');return}scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},txt=>register(txt,'qr')).catch(e=>{scanner=null;alert('No se pudo abrir la cámara. Revisa permisos del navegador o usa registro manual.\n'+e)})}
function stopScan(){if(scanner){scanner.stop().catch(()=>{});scanner=null}}
function register(raw,method){let id=String(raw).trim().replace(/^ASISTIO:/i,''),s=students.find(x=>x.id===id);if(!s)return result('QR no reconocido','bad');if(s.course!==current.course)return result(`${s.name} pertenece a ${s.course}`,'warn');if(current.records[id])return result(`${s.name} ya fue registrado a las ${current.records[id].time}`,'warn');let now=new Date(),start=new Date(current.start),mins=(now-start)/60000,status=mins>Number(cfg.late||10)?'Atrasado':'Presente';current.records[id]={studentId:id,status,time:now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),method};result('✓ '+s.name+' · '+status,status==='Atrasado'?'warn':'ok');if(method!=='qr')setTimeout(sessionUI,250)}
function result(t,c){let x=$('#scanResult');if(x)x.innerHTML=`<div class="bigresult ${c}">${esc(t)}</div>`}
function removeRecord(id){delete current.records[id];sessionUI()}
function manualAdd(){let list=students.filter(s=>s.course===current.course&&s.active!==false&&!current.records[s.id]);modal(`<h2>Registro manual</h2><select id="manualSel">${list.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><br><br><div class="actions"><button class="btn primary" onclick="let v=$('#manualSel').value;closeModal();register(v,'manual')">Registrar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function closeSession(){stopScan();if(!confirm('¿Cerrar y guardar esta asistencia? Los alumnos pendientes quedarán Ausentes.'))return;let list=students.filter(s=>s.course===current.course&&s.active!==false);for(let s of list)if(!current.records[s.id])current.records[s.id]={studentId:s.id,status:'Ausente',time:'',method:'cierre'};current.closed=true;current.closedAt=new Date().toISOString();sessions.push(current);current=null;save();go('historial')}
function historial(){let rows=[...sessions].reverse().map((s,i)=>{let vals=Object.values(s.records),p=vals.filter(x=>x.status==='Presente').length,l=vals.filter(x=>x.status==='Atrasado').length,a=vals.filter(x=>x.status==='Ausente').length,idx=sessions.indexOf(s);return `<tr><td>${esc(s.date)}</td><td>${esc(s.course)}</td><td>${esc(s.subject)}</td><td>${p}</td><td>${l}</td><td>${a}</td><td><button class="btn ghost" onclick="viewSession(${idx})">Ver</button></td></tr>`}).join('');$('#app').innerHTML=`<div class="card"><div class="row"><div style="flex:1"><h2>Historial</h2><span class="muted">${sessions.length} sesiones guardadas</span></div><button class="btn primary" onclick="exportExcel()">Exportar Excel</button></div></div><div class="card" style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Curso</th><th>Asignatura</th><th>Presentes</th><th>Atrasos</th><th>Ausentes</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=7>Sin asistencias guardadas.</td></tr>'}</tbody></table></div>`}
function viewSession(i){let s=sessions[i],rows=Object.values(s.records).map(r=>{let st=students.find(x=>x.id===r.studentId)||{};return `<tr><td>${esc(st.name||r.studentId)}</td><td>${esc(st.rut||'')}</td><td>${esc(r.status)}</td><td>${esc(r.time)}</td><td>${esc(r.method)}</td></tr>`}).join('');modal(`<h2>${esc(s.course)} · ${esc(s.date)}</h2><p>${esc(s.subject)} · Bloque ${esc(s.block)}</p><div style="overflow:auto"><table><tr><th>Alumno</th><th>RUT</th><th>Estado</th><th>Hora</th><th>Método</th></tr>${rows}</table></div><br><button class="btn ghost" onclick="closeModal()">Cerrar</button>`)}
function datos(){$('#app').innerHTML=`<div class="card"><h2>Base institucional</h2><p class="muted">Comparte alumnos, cursos e identificación del colegio. No reemplaza las asistencias locales.</p><div class="actions"><button class="btn primary" onclick="exportBase()">Exportar base .asistio</button><label class="btn ghost">Importar base<input type="file" accept=".asistio,.json" class="hidden" onchange="importBase(this.files[0])"></label></div></div><div class="card"><h2>Importación rápida CSV</h2><p>Columnas: <b>nombre,rut,curso,numero</b>. También acepta punto y coma.</p><label class="btn ghost">Seleccionar CSV<input type="file" accept=".csv,text/csv" class="hidden" onchange="importCSV(this.files[0])"></label></div><div class="card"><h2>Respaldo completo</h2><p class="muted">Incluye base institucional, configuración y todo el historial de asistencias.</p><div class="actions"><button class="btn primary" onclick="backup()">Descargar respaldo</button><label class="btn ghost">Restaurar respaldo<input type="file" accept=".asistio-backup,.json" class="hidden" onchange="restore(this.files[0])"></label></div></div><div class="card"><h2>Excel</h2><button class="btn primary" onclick="exportExcel()">Exportar asistencias para Excel</button><p class="muted">Genera un archivo .xls compatible con Excel, sin depender de Internet.</p></div>`}
function download(name,text,type='application/json'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportBase(){download(`${safe(cfg.school)}_${cfg.year}.asistio`,JSON.stringify({format:'asistio-base',version:1,school:cfg.school,year:cfg.year,generated:new Date().toISOString(),students},null,2))}
function importBase(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(d.format!=='asistio-base')throw 0;if(!confirm(`Importar base de ${d.school} con ${d.students.length} alumnos? Las asistencias locales se conservarán.`))return;students=d.students;cfg.school=d.school||cfg.school;cfg.year=d.year||cfg.year;save();render();alert('Base institucional actualizada.')}catch{alert('Archivo de base no válido.')}};r.readAsText(f)}
function backup(){download(`Respaldo_Asistio_${safe(cfg.school)}_${new Date().toISOString().slice(0,10)}.asistio-backup`,JSON.stringify({format:'asistio-backup',version:1,cfg,students,sessions,generated:new Date().toISOString()},null,2))}
function restore(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(d.format!=='asistio-backup')throw 0;if(!confirm('Esto reemplazará los datos locales actuales. ¿Continuar?'))return;cfg=d.cfg;students=d.students;sessions=d.sessions;save();render();alert('Respaldo restaurado.')}catch{alert('Respaldo no válido.')}};r.readAsText(f)}
function importCSV(f){if(!f)return;let r=new FileReader;r.onload=()=>{let lines=r.result.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),sep=lines[0].includes(';')?';':',',head=lines.shift().split(sep).map(x=>x.trim().toLowerCase()),n=0;for(let line of lines){let a=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,'')),o={};head.forEach((h,i)=>o[h]=a[i]||'');let name=o.nombre||o.name,course=o.curso||o.course;if(name&&course){students.push({id:o.id||uid(),name,rut:o.rut||'',course,list:o.numero||o.número||o.lista||'',active:true});n++}}save();render();alert(`${n} alumnos importados.`)};r.readAsText(f,'UTF-8')}
function exportExcel(){let rows=[];for(let s of sessions)for(let r of Object.values(s.records)){let st=students.find(x=>x.id===r.studentId)||{};rows.push([s.date,s.course,st.list||'',st.id||r.studentId,st.rut||'',st.name||'',s.subject,s.block||'',r.status,r.time||'',r.method||''])}let headers=['Fecha','Curso','N° lista','ID','RUT','Nombre','Asignatura','Bloque','Estado','Hora registro','Método'];let xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Asistencia"><Table>${[headers,...rows].map(row=>'<Row>'+row.map(v=>`<Cell><Data ss:Type="String">${String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</Data></Cell>`).join('')+'</Row>').join('')}</Table></Worksheet></Workbook>`;download(`Asistencia_Asistio_${new Date().toISOString().slice(0,10)}.xls`,xml,'application/vnd.ms-excel')}
function config(){$('#app').innerHTML=`<div class="card"><h2>Configuración</h2><div class="field"><label>Establecimiento</label><input id="cschool" value="${esc(cfg.school)}"></div><div class="row"><div class="field"><label>Año académico</label><input id="cyear" type="number" value="${cfg.year}"></div><div class="field"><label>Minutos para atraso</label><input id="clate" type="number" value="${cfg.late}"></div></div><div class="field"><label>Asignaturas (separadas por coma)</label><input id="csubs" value="${esc(cfg.subjects.join(', '))}"></div><br><button class="btn primary" onclick="saveCfg()">Guardar configuración</button></div><div class="card"><h3>Almacenamiento</h3><p>Alumnos: ${students.length}<br>Sesiones: ${sessions.length}</p><p class="muted">Los datos de esta versión se almacenan localmente en el navegador. Usa Respaldo completo antes de borrar datos del navegador o cambiar de dispositivo.</p></div>`}
function saveCfg(){cfg.school=$('#cschool').value.trim()||'Mi Colegio';cfg.year=Number($('#cyear').value)||new Date().getFullYear();cfg.late=Number($('#clate').value)||0;cfg.subjects=$('#csubs').value.split(',').map(x=>x.trim()).filter(Boolean);save();render();alert('Configuración guardada.')}
function safe(s){return String(s).replace(/[^a-z0-9áéíóúñ_-]+/gi,'_')}
function modal(html){$('#modal').className='modal';$('#modal').innerHTML=`<div class="card">${html}</div>`}function closeModal(){$('#modal').className='hidden';$('#modal').innerHTML=''}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
nav();render();
</script></body></html>
