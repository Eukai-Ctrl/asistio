<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asistio v1.0 Flujo Completo</title><meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#111827}
header{background:#0f172a;color:white;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.brand{font-size:22px;font-weight:800}.small{font-size:12px;color:#64748b}.topuser{font-size:12px;text-align:right}
.wrap{max-width:1180px;margin:auto;padding:16px}.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
button,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:white}
button.primary,.active{background:#0f172a;color:white}.danger{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px #00000008}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{padding:16px;border:1px solid #e5e7eb;border-radius:14px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;margin:5px 0 10px;background:white}
label{font-size:13px;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:150px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}.scroll{overflow:auto}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:12px}.msg{padding:10px;border-radius:9px;margin:8px 0;background:#eef2ff}.error{background:#fee2e2;color:#991b1b}
#reader{max-width:520px;margin:auto}.hidden{display:none!important}.login{max-width:430px;margin:60px auto}
.qrbox{text-align:center}.qrbox img,.qrbox canvas{max-width:220px}.scanitem{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #eee}
@media(max-width:650px){.wrap{padding:10px}header{align-items:flex-start}.topuser{max-width:55%}table{font-size:12px}th,td{padding:7px}.nav button{flex:1 1 30%}}
.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px;font-size:12px}
.warn{background:#fef3c7;color:#92400e}.muted{color:#64748b}.sectiontitle{margin-top:0}
dialog{border:0;border-radius:16px;max-width:620px;width:calc(100% - 24px);box-shadow:0 20px 60px #0004}
dialog::backdrop{background:#0006}

.bigaction{font-size:18px;padding:16px 20px}.success{background:#dcfce7;color:#166534}
.cameraWrap{max-width:560px;margin:0 auto}.cameraWrap #reader{width:100%}
.attgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.studentline{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #e5e7eb}
@media print{header,.nav,#msg,.noprint{display:none!important}.card{border:0;box-shadow:none}.qrprint{break-inside:avoid;display:inline-block;width:48%;vertical-align:top;text-align:center;padding:16px}}
</style>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="loginPanel" class="login card">
<h1>Asistio</h1><p>Asistencia escolar online</p><div id="loginMsg"></div>
<form id="loginForm">
<label>Correo</label><input id="email" type="email" autocomplete="username" required>
<label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" class="primary" style="width:100%" type="submit">Ingresar</button>
</form>
<div class="small" style="margin-top:10px">Asistio v1.0 Flujo Completo</div>
</div>
<div id="app" class="hidden">
<header><div><div class="brand">Asistio</div><div style="font-size:12px">Asistencia escolar online</div></div><div class="topuser" id="who"></div></header>
<div class="wrap">
<div class="nav" id="nav"></div><div id="msg"></div><main id="main"></main>
</div></div>
<script>
const cfg=window.ASISTIO_CONFIG||{};
const $ = (id)=>document.getElementById(id);
let sb=null;
let session=null, memberships=[], currentSchool=null, currentRole=null, scanner=null, currentAttendance=null;
try{
  if(!cfg.SUPABASE_URL || !cfg.SUPABASE_PUBLISHABLE_KEY) throw new Error("Falta configurar Supabase en config.js");
  if(!window.supabase) throw new Error("No se pudo cargar la librería de Supabase");
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);
}catch(e){
  window.addEventListener("DOMContentLoaded",()=>{$("loginMsg").innerHTML=`<div class="msg error">${esc(e.message)}</div>`});
}
const roles={superadmin:'Superadministrador',admin:'Administrador',teacher:'Docente',viewer:'Consulta'};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function notice(t,err=false){document.getElementById('msg').innerHTML=`<div class="msg ${err?'error':''}">${esc(t)}</div>`;setTimeout(()=>{let x=document.getElementById('msg');if(x)x.innerHTML=''},5000)}
async function login(ev){
  if(ev) ev.preventDefault();
  const btn=$("loginBtn"), msg=$("loginMsg");
  if(!sb){ msg.innerHTML='<div class="msg error">Supabase no está disponible. Revisa config.js.</div>'; return; }
  btn.disabled=true; btn.textContent="Ingresando..."; msg.innerHTML="";
  try{
    const email=$("email").value.trim(), password=$("password").value;
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    await boot(data.session);
  }catch(e){
    msg.innerHTML=`<div class="msg error">${esc(e.message||String(e))}</div>`;
  }finally{
    btn.disabled=false; btn.textContent="Ingresar";
  }
}
async function logout(){if(scanner)try{await scanner.stop()}catch(e){} await sb.auth.signOut();location.reload()}
async function boot(s){session=s; let {data,error}=await sb.from('school_members').select('id,school_id,role,active,schools(id,name,active)').eq('user_id',s.user.id).eq('active',true);if(error){$("loginMsg").innerHTML=`<div class="msg error">${esc(error.message)}</div>`;return}
memberships=data||[]; if(!memberships.length){$("loginMsg").innerHTML='<div class="msg error">Usuario sin acceso asignado.</div>';return}
currentSchool=memberships[0].schools;currentRole=memberships[0].role;$("loginPanel").classList.add("hidden");$("app").classList.remove("hidden");renderNav();home()}
function roleForSchool(id){let m=memberships.find(x=>x.school_id===id);return m?.role||(memberships.some(x=>x.role==='superadmin')?'superadmin':'viewer')}
function renderNav(){currentRole=roleForSchool(currentSchool?.id);$("who").innerHTML=`${esc(session.user.email)} · ${esc(roles[currentRole])}<br>${esc(currentSchool?.name||'')}`;
let items=[['Inicio','home()'],['Colegios','schools()'],['Usuarios','users()'],['Cursos','courses()'],['Asignaturas','subjects()'],['Alumnos','students()'],['QR','qrCenter()'],['Asistencia','attendance()'],['Historial','history()'],['Auditoría','audit()']];
if(currentRole==='teacher')items=items.filter(x=>['Inicio','Alumnos','QR','Asistencia','Historial'].includes(x[0]));
if(currentRole==='viewer')items=items.filter(x=>['Inicio','Alumnos','Historial'].includes(x[0]));
$("nav").innerHTML=items.map(x=>`<button onclick="${x[1]}">${x[0]}</button>`).join('')+`<button onclick="logout()">Salir</button>`}
async function home(){let sid=currentSchool.id;let [st,co,se]=await Promise.all([sb.from('students').select('*',{count:'exact',head:true}).eq('school_id',sid).eq('active',true),sb.from('courses').select('*',{count:'exact',head:true}).eq('school_id',sid).eq('active',true),sb.from('attendance_sessions').select('*',{count:'exact',head:true}).eq('school_id',sid)]);
$("main").innerHTML=`<div class=card><h2>Dashboard</h2><div class=row><div><b>${esc(currentSchool.name)}</b><div class=small>${esc(roles[currentRole])}</div></div><div><button onclick="chooseSchool()">Cambiar colegio</button></div></div></div><div class=grid><div class=stat>Alumnos activos<h2>${st.count||0}</h2></div><div class=stat>Cursos<h2>${co.count||0}</h2></div><div class=stat>Sesiones de asistencia<h2>${se.count||0}</h2></div></div>`}
async function chooseSchool(){let {data}=await sb.from('schools').select('id,name,active').eq('active',true).order('name');$("main").innerHTML=`<div class=card><h2>Seleccionar colegio</h2>${(data||[]).map(s=>`<button style="margin:5px" onclick='setSchool(${JSON.stringify(JSON.stringify(s))})'>${esc(s.name)}</button>`).join('')}</div>`}
function setSchool(js){currentSchool=JSON.parse(js);renderNav();home()}
async function schools(){
 if(currentRole!=='superadmin')return notice('Solo Superadministrador.',true);
 let {data,error}=await sb.from('schools').select('*').order('name');if(error)return notice(error.message,true);
 $("main").innerHTML=`<div class=card><h2>Colegios</h2><div class=row><div><label>Nombre</label><input id=sname></div><div><label>Código</label><input id=scode></div><div><label>Comuna</label><input id=scommune></div><div><button class=primary onclick="addSchool()">Crear colegio</button></div></div></div>
 <div class="card scroll"><table><tr><th>Nombre</th><th>Código</th><th>Comuna</th><th>Estado</th><th>Administrar</th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.code||'')}</td><td>${esc(x.commune||'')}</td><td>${x.active?'Activo':'Inactivo'}</td><td><div class=actions><button onclick="editSchool('${x.id}','${encodeURIComponent(x.name)}','${encodeURIComponent(x.code||'')}','${encodeURIComponent(x.commune||'')}')">Editar</button><button onclick="toggleSchool('${x.id}',${!x.active})">${x.active?'Desactivar':'Activar'}</button></div></td></tr>`).join('')}</table></div>
 <dialog id=schooldlg><h3>Editar colegio</h3><input type=hidden id=esSchool><label>Nombre</label><input id=esName><label>Código</label><input id=esCode><label>Comuna</label><input id=esCommune><div class=actions><button class=primary onclick="saveSchool()">Guardar</button><button onclick="schooldlg.close()">Cancelar</button></div></dialog>`}
async function addSchool(){let {data,error}=await sb.from('schools').insert({name:$("sname").value.trim(),code:$("scode").value.trim()||null,commune:$("scommune").value.trim()||null,active:true}).select().single();if(error)return notice(error.message,true);await sb.from('school_members').insert({school_id:data.id,user_id:session.user.id,role:'superadmin',active:true});await reloadMemberships();notice('Colegio creado');schools()}
function editSchool(id,n,c,co){$("esSchool").value=id;$("esName").value=decodeURIComponent(n);$("esCode").value=decodeURIComponent(c);$("esCommune").value=decodeURIComponent(co);$("schooldlg").showModal()}
async function saveSchool(){let {error}=await sb.from('schools').update({name:$("esName").value.trim(),code:$("esCode").value.trim()||null,commune:$("esCommune").value.trim()||null}).eq('id',$("esSchool").value);if(error)return notice(error.message,true);$("schooldlg").close();notice('Colegio actualizado');schools()}
async function toggleSchool(id,active){let {error}=await sb.from('schools').update({active}).eq('id',id);if(error)return notice(error.message,true);notice(active?'Colegio activado':'Colegio desactivado');schools()}
async function reloadMemberships(){let {data}=await sb.from('school_members').select('id,school_id,role,active,schools(id,name,active)').eq('user_id',session.user.id).eq('active',true);memberships=data||[]}
async function invokeAdmin(body){
  const {data,error}=await sb.functions.invoke('manage-user',{body:{...body,school_id:currentSchool.id}});
  if(error){
    let msg=error.message;
    try{if(error.context){const j=await error.context.json();msg=j.error||msg}}catch(_){}
    throw new Error(msg);
  }
  if(data?.error)throw new Error(data.error);
  return data;
}
async function users(){
 if(!['superadmin','admin'].includes(currentRole))return notice('Sin permiso.',true);
 let {data,error}=await sb.from('school_members').select('id,user_id,role,active,profiles(id,display_name,first_name,last_name)').eq('school_id',currentSchool.id).order('created_at',{ascending:true});
 if(error)return notice(error.message,true);
 $("main").innerHTML=`<div class=card><h2>Usuarios y perfiles</h2><p class=small>Administración de cuentas del colegio.</p>
 <div class=row><div><label>Correo</label><input id=uemail type=email></div><div><label>Nombre</label><input id=uname></div><div><label>Contraseña temporal</label><input id=upass type=password minlength=6></div><div><label>Perfil</label><select id=urole><option value=admin>Administrador</option><option value=teacher selected>Docente</option><option value=viewer>Consulta</option>${currentRole==='superadmin'?'<option value=superadmin>Superadministrador</option>':''}</select></div><div><button class=primary onclick="createUser()">Crear usuario</button></div></div></div>
 <div class="card scroll"><table><tr><th>Usuario</th><th>Perfil</th><th>Estado</th><th>Administrar</th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.profiles?.display_name||x.user_id)}</td><td>${esc(roles[x.role]||x.role)}</td><td>${x.active?'Activo':'Inactivo'}</td><td><div class=actions><button onclick="editUser('${x.id}','${x.user_id}','${encodeURIComponent(x.profiles?.display_name||'')}','${x.role}',${x.active})">Editar</button><button class=warn onclick="resetPassword('${x.user_id}')">Contraseña</button><button onclick="toggleUser('${x.id}','${x.user_id}',${!x.active})">${x.active?'Desactivar':'Activar'}</button>${x.user_id!==session.user.id?`<button class=danger onclick="deleteUser('${x.id}','${x.user_id}')">Eliminar</button>`:''}</div></td></tr>`).join('')}</table></div>
 <dialog id=userdlg><h3>Editar usuario</h3><input type=hidden id=eMember><input type=hidden id=eUser><label>Nombre</label><input id=eName><label>Nuevo correo (opcional)</label><input id=eEmail type=email><label>Perfil</label><select id=eRole><option value=admin>Administrador</option><option value=teacher>Docente</option><option value=viewer>Consulta</option>${currentRole==='superadmin'?'<option value=superadmin>Superadministrador</option>':''}</select><div class=actions><button class=primary onclick="saveUser()">Guardar</button><button onclick="userdlg.close()">Cancelar</button></div></dialog>`;
}
async function createUser(){try{await invokeAdmin({action:'create',email:$("uemail").value.trim(),password:$("upass").value,name:$("uname").value.trim(),role:$("urole").value});notice('Usuario creado');users()}catch(e){notice(e.message,true)}}
function editUser(mid,uid,name,role,active){$("eMember").value=mid;$("eUser").value=uid;$("eName").value=decodeURIComponent(name);$("eEmail").value='';$("eRole").value=role;$("userdlg").showModal()}
async function saveUser(){try{await invokeAdmin({action:'update',member_id:$("eMember").value,user_id:$("eUser").value,name:$("eName").value.trim(),email:$("eEmail").value.trim()||null,role:$("eRole").value});$("userdlg").close();notice('Usuario actualizado');users()}catch(e){notice(e.message,true)}}
async function resetPassword(uid){let pw=prompt('Nueva contraseña (mínimo 6 caracteres):');if(!pw)return;if(pw.length<6)return notice('La contraseña debe tener al menos 6 caracteres.',true);try{await invokeAdmin({action:'password',user_id:uid,password:pw});notice('Contraseña actualizada')}catch(e){notice(e.message,true)}}
async function toggleUser(mid,uid,active){try{await invokeAdmin({action:'toggle',member_id:mid,user_id:uid,active});notice(active?'Usuario activado':'Usuario desactivado');users()}catch(e){notice(e.message,true)}}
async function deleteUser(mid,uid){if(!confirm('¿Eliminar definitivamente este usuario y su acceso?'))return;try{await invokeAdmin({action:'delete',member_id:mid,user_id:uid});notice('Usuario eliminado');users()}catch(e){notice(e.message,true)}}
async function ensureYear(){
 let y=new Date().getFullYear();let {data}=await sb.from('academic_years').select('*').eq('school_id',currentSchool.id).eq('year',y).maybeSingle();
 if(data)return data.id;
 let {data:n,error}=await sb.from('academic_years').insert({school_id:currentSchool.id,year:y,active:true}).select().single();if(error)throw error;return n.id
}
async function courses(){
 let {data,error}=await sb.from('courses').select('*').eq('school_id',currentSchool.id).order('name');if(error)return notice(error.message,true);
 $("main").innerHTML=`<div class=card><h2>Cursos</h2>${['superadmin','admin'].includes(currentRole)?`<div class=row><div><label>Nombre</label><input id=cname placeholder="1° Medio A"></div><div><label>Nivel</label><input id=clevel placeholder="1° Medio"></div><div><label>Letra</label><input id=cletter placeholder="A"></div><div><button class=primary onclick="addCourse()">Crear curso</button></div></div>`:''}</div>
 <div class="card scroll"><table><tr><th>Curso</th><th>Nivel</th><th>Letra</th><th>Estado</th><th></th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.level||'')}</td><td>${esc(x.letter||'')}</td><td>${x.active?'Activo':'Inactivo'}</td><td>${['superadmin','admin'].includes(currentRole)?`<div class=actions><button onclick="editCourse('${x.id}','${encodeURIComponent(x.name)}','${encodeURIComponent(x.level||'')}','${encodeURIComponent(x.letter||'')}')">Editar</button><button onclick="toggleCourse('${x.id}',${!x.active})">${x.active?'Desactivar':'Activar'}</button></div>`:''}</td></tr>`).join('')}</table></div>
 <dialog id=coursedlg><h3>Editar curso</h3><input type=hidden id=ecId><label>Nombre</label><input id=ecName><label>Nivel</label><input id=ecLevel><label>Letra</label><input id=ecLetter><div class=actions><button class=primary onclick="saveCourse()">Guardar</button><button onclick="coursedlg.close()">Cancelar</button></div></dialog>`}
async function addCourse(){try{let y=await ensureYear();let {error}=await sb.from('courses').insert({school_id:currentSchool.id,academic_year_id:y,name:$("cname").value.trim(),level:$("clevel").value.trim()||null,letter:$("cletter").value.trim()||null,active:true});if(error)throw error;notice('Curso creado');courses()}catch(e){notice(e.message,true)}}
function editCourse(id,n,l,le){$("ecId").value=id;$("ecName").value=decodeURIComponent(n);$("ecLevel").value=decodeURIComponent(l);$("ecLetter").value=decodeURIComponent(le);$("coursedlg").showModal()}
async function saveCourse(){let {error}=await sb.from('courses').update({name:$("ecName").value.trim(),level:$("ecLevel").value.trim()||null,letter:$("ecLetter").value.trim()||null}).eq('id',$("ecId").value);if(error)return notice(error.message,true);$("coursedlg").close();notice('Curso actualizado');courses()}
async function toggleCourse(id,active){let {error}=await sb.from('courses').update({active}).eq('id',id);if(error)return notice(error.message,true);notice(active?'Curso activado':'Curso desactivado');courses()}
async function subjects(){
 let {data,error}=await sb.from('subjects').select('*').eq('school_id',currentSchool.id).order('name');if(error)return notice(error.message,true);
 $("main").innerHTML=`<div class=card><h2>Asignaturas</h2>${['superadmin','admin'].includes(currentRole)?`<div class=row><div><label>Nombre</label><input id=subname></div><div><label>Código</label><input id=subcode></div><div><button class=primary onclick="addSubject()">Crear asignatura</button></div></div>`:''}</div><div class="card scroll"><table><tr><th>Asignatura</th><th>Código</th><th>Estado</th><th></th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.code||'')}</td><td>${x.active?'Activo':'Inactivo'}</td><td>${['superadmin','admin'].includes(currentRole)?`<div class=actions><button onclick="editSubject('${x.id}','${encodeURIComponent(x.name)}','${encodeURIComponent(x.code||'')}')">Editar</button><button onclick="toggleSubject('${x.id}',${!x.active})">${x.active?'Desactivar':'Activar'}</button></div>`:''}</td></tr>`).join('')}</table></div><dialog id=subjectdlg><h3>Editar asignatura</h3><input type=hidden id=esuId><label>Nombre</label><input id=esuName><label>Código</label><input id=esuCode><div class=actions><button class=primary onclick="saveSubject()">Guardar</button><button onclick="subjectdlg.close()">Cancelar</button></div></dialog>`}
async function addSubject(){let {error}=await sb.from('subjects').insert({school_id:currentSchool.id,name:$("subname").value.trim(),code:$("subcode").value.trim()||null,active:true});if(error)return notice(error.message,true);notice('Asignatura creada');subjects()}
function editSubject(id,n,c){$("esuId").value=id;$("esuName").value=decodeURIComponent(n);$("esuCode").value=decodeURIComponent(c);$("subjectdlg").showModal()}
async function saveSubject(){let {error}=await sb.from('subjects').update({name:$("esuName").value.trim(),code:$("esuCode").value.trim()||null}).eq('id',$("esuId").value);if(error)return notice(error.message,true);$("subjectdlg").close();notice('Asignatura actualizada');subjects()}
async function toggleSubject(id,active){let {error}=await sb.from('subjects').update({active}).eq('id',id);if(error)return notice(error.message,true);notice(active?'Asignatura activada':'Asignatura desactivada');subjects()}
async function students(){
 let [{data,error},{data:coursesData}]=await Promise.all([
  sb.from('students').select('*').eq('school_id',currentSchool.id).order('last_name'),
  sb.from('courses').select('id,name').eq('school_id',currentSchool.id).eq('active',true).order('name')
 ]);
 if(error)return notice(error.message,true);
 window._courses=coursesData||[];
 $("main").innerHTML=`<div class=card><h2>Alumnos</h2>${['superadmin','admin'].includes(currentRole)?`<div class=row><div><label>RUT</label><input id=srut></div><div><label>Nombres</label><input id=sfirst></div><div><label>Apellido paterno</label><input id=slast></div><div><label>Apellido materno</label><input id=slast2></div><div><button class=primary onclick="addStudent()">Agregar</button></div></div><label>Importar Excel</label><input type=file id=xfile accept=".xlsx,.xls,.csv" onchange="importStudents(event)">`:''}<input id=search placeholder="Buscar alumno..." oninput="filterRows(this.value)"></div>

async function importStudents(ev){let f=ev.target.files[0];if(!f)return;let wb=XLSX.read(await f.arrayBuffer());let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let payload=rows.map(r=>({school_id:currentSchool.id,rut:String(r.RUT||r.rut||'').trim()||null,first_name:String(r.Nombres||r.Nombre||r.first_name||'').trim(),last_name:String(r['Apellido paterno']||r.Apellido||r.last_name||'').trim(),second_last_name:String(r['Apellido materno']||r.second_last_name||'').trim()||null,active:true})).filter(x=>x.first_name&&x.last_name);if(!payload.length)return notice('No encontré columnas de nombre/apellido.',true);let {error}=await sb.from('students').upsert(payload,{onConflict:'school_id,rut'});if(error)return notice(error.message,true);notice(`${payload.length} registros procesados`);students()}
async function showQR(id){let {data,error}=await sb.from('students').select('id,first_name,last_name,qr_token').eq('id',id).single();if(error)return notice(error.message,true);$("main").innerHTML=`<div class="card qrbox"><h2>${esc(data.first_name+' '+data.last_name)}</h2><div id=qrc style="display:inline-block"></div><p class=small>El QR contiene solo el token interno Asistio.</p><button onclick="students()">Volver</button></div>`;if(!window.QRCode)return notice('No se pudo cargar el generador QR.',true);new QRCode($("qrc"),{text:'ASISTIO:'+data.qr_token,width:260,height:260,correctLevel:QRCode.CorrectLevel.M})}
async function qrCenter(){

 $("main").innerHTML=`<div class="card noprint"><button onclick="qrCenter()">Volver</button> <button class=primary onclick="window.print()">Imprimir / Guardar PDF</button></div><div class=card id=qrbulk><h2>Credenciales QR</h2></div>`;

}
async function attendance(){
 if(currentAttendance)return scanScreen();
 let [{data:cs},{data:ss}]=await Promise.all([sb.from('courses').select('*').eq('school_id',currentSchool.id).eq('active',true).order('name'),sb.from('subjects').select('*').eq('school_id',currentSchool.id).eq('active',true).order('name')]);
 $("main").innerHTML=`<div class=card><h2>Pasar lista</h2><p class=small>Selecciona curso y bloque. Después podrás usar cámara QR o registro manual.</p><div class=row><div><label>Curso</label><select id=acourse>${(cs||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>Asignatura</label><select id=asubject><option value="">Sin asignatura</option>${(ss||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>Bloque</label><input id=ablock placeholder="1-2"></div><div><label>Tolerancia atraso (min)</label><input id=alate type=number min=0 value=10></div></div><button class="primary bigaction" onclick="startAttendance()">Iniciar asistencia</button></div>`}
async function startAttendance(){
 let cid=$("acourse").value;if(!cid)return notice('Primero crea un curso.',true);
 let {data:enr,error:ee}=await sb.from('enrollments').select('student_id',{count:'exact'}).eq('course_id',cid).eq('active',true);if(ee)return notice(ee.message,true);if(!enr?.length)return notice('Este curso no tiene alumnos matriculados.',true);
 let {data,error}=await sb.from('attendance_sessions').insert({school_id:currentSchool.id,course_id:cid,subject_id:$("asubject").value||null,teacher_id:session.user.id,block_name:$("ablock").value.trim()||'Sin bloque',late_tolerance_minutes:+$("alate").value||0,status:'open'}).select().single();if(error)return notice(error.message,true);currentAttendance=data;await scanScreen()

async function getRoster(){
 let {data,error}=await sb.from('enrollments').select('student_id,students(id,rut,first_name,last_name,second_last_name,active)').eq('course_id',currentAttendance.course_id).eq('active',true);if(error)throw error;
 let {data:rec,error:re}=await sb.from('attendance_records').select('id,student_id,status,registered_at,method').eq('session_id',currentAttendance.id);if(re)throw re;
 let map=new Map((rec||[]).map(r=>[r.student_id,r]));return (data||[]).filter(x=>x.students?.active).map(x=>({student:x.students,record:map.get(x.student_id)||null}))

async function scanScreen(){
 try{let roster=await getRoster();let present=roster.filter(x=>x.record).length;
 $("main").innerHTML=`<div class=card><h2>Asistencia en curso</h2><div class=attgrid><div class=stat>Registrados<h2>${present}/${roster.length}</h2></div><div class=stat>Inicio<h3>${new Date(currentAttendance.started_at).toLocaleTimeString()}</h3></div></div><div class="cameraWrap"><div id=reader></div></div><div class="actions noprint"><button class="primary bigaction" onclick="startScanner()">📷 Abrir cámara QR</button><button onclick="stopScanner()">Detener cámara</button><button onclick="refreshAttendance()">Actualizar</button><button class=danger onclick="closeAttendance()">Cerrar lista</button></div><div id=scanmsg></div></div>
 <div class=card><h3>Lista del curso</h3><input placeholder="Buscar alumno" oninput="filterAttendance(this.value)"><div id=roster>${roster.map(x=>studentAttendanceRow(x)).join('')}</div></div>`;
 }catch(e){notice(e.message,true)}
}
function studentAttendanceRow(x){let st=x.student,r=x.record;return `<div class="studentline attendance-row"><span><b>${esc(st.last_name+', '+st.first_name)}</b><br><span class=small>${esc(st.rut||'')}</span></span><span>${r?`<span class=badge>${labelStatus(r.status)}</span> <button onclick="setAttendance('${st.id}','present')">P</button><button onclick="setAttendance('${st.id}','late')">Atraso</button><button onclick="setAttendance('${st.id}','absent')">Ausente</button>`:`<button class=ok onclick="setAttendance('${st.id}','present')">Presente</button><button class=warn onclick="setAttendance('${st.id}','late')">Atraso</button>`}</span></div>`}
function labelStatus(s){return ({present:'Presente',late:'Atrasado',absent:'Ausente',justified:'Justificado'})[s]||s}
function filterAttendance(q){q=q.toLowerCase();document.querySelectorAll('.attendance-row').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'':'none')}
async function startScanner(){
 if(scanner)return;
 if(!window.Html5Qrcode)return notice('No se cargó el lector QR. Revisa la conexión a Internet.',true);
 try{
  scanner=new Html5Qrcode('reader');
  let cams=await Html5Qrcode.getCameras();
  if(!cams?.length)throw new Error('No se detectó una cámara.');
  let preferred=cams.find(c=>/back|rear|environment|trasera/i.test(c.label))||cams[cams.length-1];
  await scanner.start(preferred.id,{fps:12,qrbox:{width:260,height:260},aspectRatio:1.0},onScan,()=>{});
  $("scanmsg").innerHTML='<div class="msg success">Cámara activa. Escanea los QR de los alumnos.</div>';
 }catch(e){scanner=null;notice('No se pudo abrir la cámara: '+(e.message||e)+'. Verifica permiso de cámara y HTTPS.',true)}
}
async function stopScanner(){if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){}scanner=null}}
let scanLock=false,lastToken='',lastScan=0;
async function onScan(text){
 let now=Date.now();if(scanLock||(text===lastToken&&now-lastScan<3000))return;scanLock=true;lastToken=text;lastScan=now;
 try{
  let token=text.startsWith('ASISTIO:')?text.slice(8):text;
  let {data:student,error}=await sb.from('students').select('id,first_name,last_name').eq('school_id',currentSchool.id).eq('qr_token',token).eq('active',true).maybeSingle();if(error)throw error;
  if(!student)throw new Error('QR no válido para este colegio');
  let {data:enrolled}=await sb.from('enrollments').select('id').eq('student_id',student.id).eq('course_id',currentAttendance.course_id).eq('active',true).maybeSingle();if(!enrolled)throw new Error('El alumno no está matriculado en este curso');
  let mins=(Date.now()-new Date(currentAttendance.started_at).getTime())/60000;let status=mins>currentAttendance.late_tolerance_minutes?'late':'present';
  await setAttendance(student.id,status,true);
  $("scanmsg").innerHTML=`<div class="msg success"><b>${esc(student.first_name+' '+student.last_name)}</b> · ${labelStatus(status)}</div>`;
  if(navigator.vibrate)navigator.vibrate(100);
 }catch(e){$("scanmsg").innerHTML=`<div class="msg error">${esc(e.message||e)}</div>`}finally{setTimeout(()=>scanLock=false,700)}
}
async function setAttendance(studentId,status,quiet=false){
 let payload={session_id:currentAttendance.id,student_id:studentId,status,registered_at:new Date().toISOString(),method:quiet?'qr':'manual',registered_by:session.user.id};
 let {error}=await sb.from('attendance_records').upsert(payload,{onConflict:'session_id,student_id'});if(error){if(!quiet)notice(error.message,true);throw error}
 if(!quiet)await refreshAttendance()
}
async function refreshAttendance(){await scanScreen()}
async function closeAttendance(){
 if(!confirm('¿Cerrar la lista? Los alumnos sin registro quedarán Ausentes.'))return;
 await stopScanner();
 try{
  let roster=await getRoster();let missing=roster.filter(x=>!x.record).map(x=>({session_id:currentAttendance.id,student_id:x.student.id,status:'absent',registered_at:new Date().toISOString(),method:'automatic',registered_by:session.user.id}));
  if(missing.length){let {error}=await sb.from('attendance_records').upsert(missing,{onConflict:'session_id,student_id'});if(error)throw error}
  let {error}=await sb.from('attendance_sessions').update({status:'closed',closed_at:new Date().toISOString()}).eq('id',currentAttendance.id);if(error)throw error;
  let id=currentAttendance.id;currentAttendance=null;notice('Asistencia cerrada');await sessionDetail(id)
 }catch(e){notice(e.message,true)}
}
