<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asistio v0.5 Administración</title><meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#111827}
header{background:#0f172a;color:white;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.brand{font-size:22px;font-weight:800}.small{font-size:12px;color:#64748b}.topuser{font-size:12px;text-align:right}
.wrap{max-width:1180px;margin:auto;padding:16px}.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
button,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:white}
button.primary,.active{background:#0f172a;color:white}.danger{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px #00000008}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{padding:16px;border:1px solid #e5e7eb;border-radius:14px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;margin:5px 0 10px;background:white}
label{font-size:13px;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:150px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}.scroll{overflow:auto}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:12px}.msg{padding:10px;border-radius:9px;margin:8px 0;background:#eef2ff}.error{background:#fee2e2;color:#991b1b}
#reader{max-width:520px;margin:auto}.hidden{display:none!important}.login{max-width:430px;margin:60px auto}
.qrbox{text-align:center}.qrbox img,.qrbox canvas{max-width:220px}.scanitem{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #eee}
@media(max-width:650px){.wrap{padding:10px}header{align-items:flex-start}.topuser{max-width:55%}table{font-size:12px}th,td{padding:7px}.nav button{flex:1 1 30%}}
.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px;font-size:12px}
.warn{background:#fef3c7;color:#92400e}.muted{color:#64748b}.sectiontitle{margin-top:0}
dialog{border:0;border-radius:16px;max-width:620px;width:calc(100% - 24px);box-shadow:0 20px 60px #0004}
dialog::backdrop{background:#0006}
</style>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="loginPanel" class="login card">
<h1>Asistio</h1><p>Asistencia escolar online</p><div id="loginMsg"></div>
<form id="loginForm">
<label>Correo</label><input id="email" type="email" autocomplete="username" required>
<label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" class="primary" style="width:100%" type="submit">Ingresar</button>
</form>
<div class="small" style="margin-top:10px">Asistio v0.5 Administración</div>
</div>
<div id="app" class="hidden">
<header><div><div class="brand">Asistio</div><div style="font-size:12px">Asistencia escolar online</div></div><div class="topuser" id="who"></div></header>
<div class="wrap">
<div class="nav" id="nav"></div><div id="msg"></div><main id="main"></main>
</div></div>
<script>
const cfg=window.ASISTIO_CONFIG||{};
const $ = (id)=>document.getElementById(id);
let sb=null;
let session=null, memberships=[], currentSchool=null, currentRole=null, scanner=null, currentAttendance=null;
try{
  if(!cfg.SUPABASE_URL || !cfg.SUPABASE_PUBLISHABLE_KEY) throw new Error("Falta configurar Supabase en config.js");
  if(!window.supabase) throw new Error("No se pudo cargar la librería de Supabase");
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);
}catch(e){
  window.addEventListener("DOMContentLoaded",()=>{$("loginMsg").innerHTML=`<div class="msg error">${esc(e.message)}</div>`});
}
const roles={superadmin:'Superadministrador',admin:'Administrador',teacher:'Docente',viewer:'Consulta'};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function notice(t,err=false){document.getElementById('msg').innerHTML=`<div class="msg ${err?'error':''}">${esc(t)}</div>`;setTimeout(()=>{let x=document.getElementById('msg');if(x)x.innerHTML=''},5000)}
async function login(ev){
  if(ev) ev.preventDefault();
  const btn=$("loginBtn"), msg=$("loginMsg");
  if(!sb){ msg.innerHTML='<div class="msg error">Supabase no está disponible. Revisa config.js.</div>'; return; }
  btn.disabled=true; btn.textContent="Ingresando..."; msg.innerHTML="";
  try{
    const email=$("email").value.trim(), password=$("password").value;
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    await boot(data.session);
  }catch(e){
    msg.innerHTML=`<div class="msg error">${esc(e.message||String(e))}</div>`;
  }finally{
    btn.disabled=false; btn.textContent="Ingresar";
  }
}
async function logout(){if(scanner)try{await scanner.stop()}catch(e){} await sb.auth.signOut();location.reload()}
async function boot(s){session=s; let {data,error}=await sb.from('school_members').select('id,school_id,role,active,schools(id,name,active)').eq('user_id',s.user.id).eq('active',true);if(error){$("loginMsg").innerHTML=`<div class="msg error">${esc(error.message)}</div>`;return}
memberships=data||[]; if(!memberships.length){$("loginMsg").innerHTML='<div class="msg error">Usuario sin acceso asignado.</div>';return}
currentSchool=memberships[0].schools;currentRole=memberships[0].role;$("loginPanel").classList.add("hidden");$("app").classList.remove("hidden");renderNav();home()}
function roleForSchool(id){let m=memberships.find(x=>x.school_id===id);return m?.role||(memberships.some(x=>x.role==='superadmin')?'superadmin':'viewer')}
function renderNav(){currentRole=roleForSchool(currentSchool?.id);$("who").innerHTML=`${esc(session.user.email)} · ${esc(roles[currentRole])}<br>${esc(currentSchool?.name||'')}`;
let items=[['Inicio','home()'],['Colegios','schools()'],['Usuarios','users()'],['Cursos','courses()'],['Asignaturas','subjects()'],['Alumnos','students()'],['QR','qrCenter()'],['Asistencia','attendance()'],['Historial','history()'],['Auditoría','audit()']];
if(currentRole==='teacher')items=items.filter(x=>['Inicio','Alumnos','QR','Asistencia','Historial'].includes(x[0]));
if(currentRole==='viewer')items=items.filter(x=>['Inicio','Alumnos','Historial'].includes(x[0]));
$("nav").innerHTML=items.map(x=>`<button onclick="${x[1]}">${x[0]}</button>`).join('')+`<button onclick="logout()">Salir</button>`}
async function home(){let sid=currentSchool.id;let [st,co,se]=await Promise.all([sb.from('students').select('*',{count:'exact',head:true}).eq('school_id',sid).eq('active',true),sb.from('courses').select('*',{count:'exact',head:true}).eq('school_id',sid).eq('active',true),sb.from('attendance_sessions').select('*',{count:'exact',head:true}).eq('school_id',sid)]);
$("main").innerHTML=`<div class=card><h2>Dashboard</h2><div class=row><div><b>${esc(currentSchool.name)}</b><div class=small>${esc(roles[currentRole])}</div></div><div><button onclick="chooseSchool()">Cambiar colegio</button></div></div></div><div class=grid><div class=stat>Alumnos activos<h2>${st.count||0}</h2></div><div class=stat>Cursos<h2>${co.count||0}</h2></div><div class=stat>Sesiones de asistencia<h2>${se.count||0}</h2></div></div>`}
async function chooseSchool(){let {data}=await sb.from('schools').select('id,name,active').eq('active',true).order('name');$("main").innerHTML=`<div class=card><h2>Seleccionar colegio</h2>${(data||[]).map(s=>`<button style="margin:5px" onclick='setSchool(${JSON.stringify(JSON.stringify(s))})'>${esc(s.name)}</button>`).join('')}</div>`}
function setSchool(js){currentSchool=JSON.parse(js);renderNav();home()}
async function schools(){if(currentRole!=='superadmin')return notice('Solo Superadministrador.',true);let {data,error}=await sb.from('schools').select('*').order('name');if(error)return notice(error.message,true);
$("main").innerHTML=`<div class=card><h2>Colegios</h2><div class=row><div><label>Nombre</label><input id=sname></div><div><label>Código</label><input id=scode></div><div><label>Comuna</label><input id=scommune></div><div><button class=primary onclick="addSchool()">Crear colegio</button></div></div></div><div class="card scroll"><table><tr><th>Nombre</th><th>Código</th><th>Comuna</th><th>Estado</th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.code)}</td><td>${esc(x.commune)}</td><td>${x.active?'Activo':'Inactivo'}</td></tr>`).join('')}</table></div>`}
async function addSchool(){let {error}=await sb.from('schools').insert({name:sname.value.trim(),code:scode.value.trim()||null,commune:scommune.value.trim()||null});if(error)return notice(error.message,true);notice('Colegio creado');schools()}
async function invokeAdmin(body){
  const {data,error}=await sb.functions.invoke('manage-user',{body:{...body,school_id:currentSchool.id}});
  if(error){
    let msg=error.message;
    try{if(error.context){const j=await error.context.json();msg=j.error||msg}}catch(_){}
    throw new Error(msg);
  }
  if(data?.error)throw new Error(data.error);
  return data;
}
async function users(){
 if(!['superadmin','admin'].includes(currentRole))return notice('Sin permiso.',true);
 let {data,error}=await sb.from('school_members').select('id,user_id,role,active,profiles(id,display_name,first_name,last_name)').eq('school_id',currentSchool.id).order('created_at',{ascending:true});
 if(error)return notice(error.message,true);
 $("main").innerHTML=`<div class=card><h2>Usuarios y perfiles</h2><p class=small>Administración de cuentas del colegio.</p>
 <div class=row><div><label>Correo</label><input id=uemail type=email></div><div><label>Nombre</label><input id=uname></div><div><label>Contraseña temporal</label><input id=upass type=password minlength=6></div><div><label>Perfil</label><select id=urole><option value=admin>Administrador</option><option value=teacher selected>Docente</option><option value=viewer>Consulta</option>${currentRole==='superadmin'?'<option value=superadmin>Superadministrador</option>':''}</select></div><div><button class=primary onclick="createUser()">Crear usuario</button></div></div></div>
 <div class="card scroll"><table><tr><th>Usuario</th><th>Perfil</th><th>Estado</th><th>Administrar</th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.profiles?.display_name||x.user_id)}</td><td>${esc(roles[x.role]||x.role)}</td><td>${x.active?'Activo':'Inactivo'}</td><td><div class=actions><button onclick="editUser('${x.id}','${x.user_id}','${encodeURIComponent(x.profiles?.display_name||'')}','${x.role}',${x.active})">Editar</button><button class=warn onclick="resetPassword('${x.user_id}')">Contraseña</button><button onclick="toggleUser('${x.id}','${x.user_id}',${!x.active})">${x.active?'Desactivar':'Activar'}</button>${x.user_id!==session.user.id?`<button class=danger onclick="deleteUser('${x.id}','${x.user_id}')">Eliminar</button>`:''}</div></td></tr>`).join('')}</table></div>
 <dialog id=userdlg><h3>Editar usuario</h3><input type=hidden id=eMember><input type=hidden id=eUser><label>Nombre</label><input id=eName><label>Nuevo correo (opcional)</label><input id=eEmail type=email><label>Perfil</label><select id=eRole><option value=admin>Administrador</option><option value=teacher>Docente</option><option value=viewer>Consulta</option>${currentRole==='superadmin'?'<option value=superadmin>Superadministrador</option>':''}</select><div class=actions><button class=primary onclick="saveUser()">Guardar</button><button onclick="userdlg.close()">Cancelar</button></div></dialog>`;
}
async function createUser(){try{await invokeAdmin({action:'create',email:$("uemail").value.trim(),password:$("upass").value,name:$("uname").value.trim(),role:$("urole").value});notice('Usuario creado');users()}catch(e){notice(e.message,true)}}
function editUser(mid,uid,name,role,active){$("eMember").value=mid;$("eUser").value=uid;$("eName").value=decodeURIComponent(name);$("eEmail").value='';$("eRole").value=role;$("userdlg").showModal()}
async function saveUser(){try{await invokeAdmin({action:'update',member_id:$("eMember").value,user_id:$("eUser").value,name:$("eName").value.trim(),email:$("eEmail").value.trim()||null,role:$("eRole").value});$("userdlg").close();notice('Usuario actualizado');users()}catch(e){notice(e.message,true)}}
async function resetPassword(uid){let pw=prompt('Nueva contraseña (mínimo 6 caracteres):');if(!pw)return;if(pw.length<6)return notice('La contraseña debe tener al menos 6 caracteres.',true);try{await invokeAdmin({action:'password',user_id:uid,password:pw});notice('Contraseña actualizada')}catch(e){notice(e.message,true)}}
async function toggleUser(mid,uid,active){try{await invokeAdmin({action:'toggle',member_id:mid,user_id:uid,active});notice(active?'Usuario activado':'Usuario desactivado');users()}catch(e){notice(e.message,true)}}
async function deleteUser(mid,uid){if(!confirm('¿Eliminar definitivamente este usuario y su acceso?'))return;try{await invokeAdmin({action:'delete',member_id:mid,user_id:uid});notice('Usuario eliminado');users()}catch(e){notice(e.message,true)}}
async function courses(){let {data}=await sb.from('courses').select('*,academic_years(year)').eq('school_id',currentSchool.id).order('name');let {data:yrs}=await sb.from('academic_years').select('*').eq('school_id',currentSchool.id).order('year',{ascending:false});
$("main").innerHTML=`<div class=card><h2>Cursos</h2>${['superadmin','admin'].includes(currentRole)?`<div class=row><div><label>Año</label><select id=cyear>${(yrs||[]).map(y=>`<option value="${y.id}">${y.year}</option>`).join('')}</select></div><div><label>Nombre</label><input id=cname placeholder="1° Medio A"></div><div><label>Nivel</label><input id=clevel placeholder="1° Medio"></div><div><label>Letra</label><input id=cletter placeholder="A"></div><div><button class=primary onclick="addCourse()">Crear</button></div></div><button onclick="addYear()">Crear año ${new Date().getFullYear()}</button>`:''}</div><div class="card scroll"><table><tr><th>Curso</th><th>Año</th><th>Estado</th></tr>${(data||[]).map(c=>`<tr><td>${esc(c.name)}</td><td>${c.academic_years?.year||''}</td><td>${c.active?'Activo':'Inactivo'}</td></tr>`).join('')}</table></div>`}
async function addYear(){let y=new Date().getFullYear();let {error}=await sb.from('academic_years').upsert({school_id:currentSchool.id,year:y,active:true},{onConflict:'school_id,year'});if(error)return notice(error.message,true);courses()}
async function addCourse(){let {error}=await sb.from('courses').insert({school_id:currentSchool.id,academic_year_id:cyear.value,name:cname.value.trim(),level:clevel.value.trim(),letter:cletter.value.trim()});if(error)return notice(error.message,true);courses()}
async function subjects(){let {data}=await sb.from('subjects').select('*').eq('school_id',currentSchool.id).order('name');$("main").innerHTML=`<div class=card><h2>Asignaturas</h2>${['superadmin','admin'].includes(currentRole)?`<div class=row><div><label>Nombre</label><input id=subname></div><div><label>Código</label><input id=subcode></div><div><button class=primary onclick="addSubject()">Crear</button></div></div>`:''}</div><div class="card scroll"><table>${(data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.code)}</td></tr>`).join('')}</table></div>`}
async function addSubject(){let {error}=await sb.from('subjects').insert({school_id:currentSchool.id,name:subname.value.trim(),code:subcode.value.trim()||null});if(error)return notice(error.message,true);subjects()}
async function students(){
 let [{data,error},{data:coursesData}]=await Promise.all([
  sb.from('students').select('*').eq('school_id',currentSchool.id).order('last_name'),
  sb.from('courses').select('id,name').eq('school_id',currentSchool.id).eq('active',true).order('name')
 ]);
 if(error)return notice(error.message,true);
 window._courses=coursesData||[];
 $("main").innerHTML=`<div class=card><h2>Alumnos</h2>${['superadmin','admin'].includes(currentRole)?`<div class=row><div><label>RUT</label><input id=srut></div><div><label>Nombres</label><input id=sfirst></div><div><label>Apellido paterno</label><input id=slast></div><div><label>Apellido materno</label><input id=slast2></div><div><button class=primary onclick="addStudent()">Agregar</button></div></div><label>Importar Excel</label><input type=file id=xfile accept=".xlsx,.xls,.csv" onchange="importStudents(event)">`:''}<input id=search placeholder="Buscar alumno..." oninput="filterRows(this.value)"></div>
 <div class="card scroll"><table id=stable><tr><th>RUT</th><th>Alumno</th><th>Estado</th><th>Administrar</th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.rut||'')}</td><td>${esc(x.first_name+' '+x.last_name+' '+(x.second_last_name||''))}</td><td>${x.active?'Activo':'Inactivo'}</td><td><div class=actions><button onclick="editStudent('${x.id}','${encodeURIComponent(x.rut||'')}','${encodeURIComponent(x.first_name)}','${encodeURIComponent(x.last_name)}','${encodeURIComponent(x.second_last_name||'')}',${x.active})">Editar</button><button onclick="manageEnrollment('${x.id}','${encodeURIComponent(x.first_name+' '+x.last_name)}')">Matrícula</button><button onclick="showQR('${x.id}')">QR</button>${['superadmin','admin'].includes(currentRole)?`<button onclick="toggleStudent('${x.id}',${!x.active})">${x.active?'Desactivar':'Activar'}</button><button class=danger onclick="deleteStudent('${x.id}')">Eliminar</button>`:''}</div></td></tr>`).join('')}</table></div>
 <dialog id=studentdlg><h3>Editar alumno</h3><input type=hidden id=esId><label>RUT</label><input id=esRut><label>Nombres</label><input id=esFirst><label>Apellido paterno</label><input id=esLast><label>Apellido materno</label><input id=esLast2><div class=actions><button class=primary onclick="saveStudent()">Guardar</button><button onclick="studentdlg.close()">Cancelar</button></div></dialog>
 <dialog id=enrolldlg><h3 id=enrollTitle>Matrícula</h3><input type=hidden id=enrollStudent><label>Curso</label><select id=enrollCourse>${(coursesData||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><div id=currentEnrollment class=msg></div><div class=actions><button class=primary onclick="saveEnrollment()">Matricular / cambiar curso</button><button onclick="enrolldlg.close()">Cerrar</button></div></dialog>`;
}
function filterRows(q){q=q.toLowerCase();[...document.querySelectorAll('#stable tr')].slice(1).forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
async function addStudent(){let {error}=await sb.from('students').insert({school_id:currentSchool.id,rut:$("srut").value.trim()||null,first_name:$("sfirst").value.trim(),last_name:$("slast").value.trim(),second_last_name:$("slast2").value.trim()||null,active:true});if(error)return notice(error.message,true);notice('Alumno agregado');students()}
function editStudent(id,rut,first,last,last2,active){$("esId").value=id;$("esRut").value=decodeURIComponent(rut);$("esFirst").value=decodeURIComponent(first);$("esLast").value=decodeURIComponent(last);$("esLast2").value=decodeURIComponent(last2);$("studentdlg").showModal()}
async function saveStudent(){let {error}=await sb.from('students').update({rut:$("esRut").value.trim()||null,first_name:$("esFirst").value.trim(),last_name:$("esLast").value.trim(),second_last_name:$("esLast2").value.trim()||null}).eq('id',$("esId").value).eq('school_id',currentSchool.id);if(error)return notice(error.message,true);$("studentdlg").close();notice('Alumno actualizado');students()}
async function toggleStudent(id,active){let {error}=await sb.from('students').update({active}).eq('id',id).eq('school_id',currentSchool.id);if(error)return notice(error.message,true);notice(active?'Alumno activado':'Alumno desactivado');students()}
async function deleteStudent(id){if(!confirm('¿Eliminar definitivamente este alumno? También se eliminarán sus matrículas y registros relacionados según las reglas de la base.'))return;let {error}=await sb.from('students').delete().eq('id',id).eq('school_id',currentSchool.id);if(error)return notice('No se pudo eliminar: '+error.message,true);notice('Alumno eliminado');students()}
async function manageEnrollment(id,name){$("enrollStudent").value=id;$("enrollTitle").textContent='Matrícula · '+decodeURIComponent(name);let {data,error}=await sb.from('enrollments').select('id,course_id,active,courses(name)').eq('student_id',id).eq('active',true);if(error)return notice(error.message,true);$("currentEnrollment").textContent=data?.length?'Curso actual: '+data.map(x=>x.courses?.name||'').join(', '):'Sin matrícula activa';if(data?.[0])$("enrollCourse").value=data[0].course_id;$("enrolldlg").showModal()}
async function saveEnrollment(){let sid=$("enrollStudent").value,cid=$("enrollCourse").value;if(!cid)return notice('Crea un curso primero.',true);let {error:e1}=await sb.from('enrollments').update({active:false}).eq('student_id',sid).eq('active',true);if(e1)return notice(e1.message,true);let {error}=await sb.from('enrollments').upsert({student_id:sid,course_id:cid,active:true},{onConflict:'student_id,course_id'});if(error)return notice(error.message,true);$("enrolldlg").close();notice('Matrícula actualizada');students()}
async function importStudents(ev){let f=ev.target.files[0];if(!f)return;let wb=XLSX.read(await f.arrayBuffer());let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let payload=rows.map(r=>({school_id:currentSchool.id,rut:String(r.RUT||r.rut||'').trim()||null,first_name:String(r.Nombres||r.Nombre||r.first_name||'').trim(),last_name:String(r['Apellido paterno']||r.Apellido||r.last_name||'').trim(),second_last_name:String(r['Apellido materno']||r.second_last_name||'').trim()||null,active:true})).filter(x=>x.first_name&&x.last_name);if(!payload.length)return notice('No encontré columnas de nombre/apellido.',true);let {error}=await sb.from('students').upsert(payload,{onConflict:'school_id,rut'});if(error)return notice(error.message,true);notice(`${payload.length} registros procesados`);students()}
async function showQR(id){let {data,error}=await sb.from('students').select('id,first_name,last_name,qr_token').eq('id',id).single();if(error)return notice(error.message,true);$("main").innerHTML=`<div class="card qrbox"><h2>${esc(data.first_name+' '+data.last_name)}</h2><div id=qrc style="display:inline-block"></div><p class=small>El QR contiene solo el token interno Asistio.</p><button onclick="students()">Volver</button></div>`;if(!window.QRCode)return notice('No se pudo cargar el generador QR.',true);new QRCode($("qrc"),{text:'ASISTIO:'+data.qr_token,width:260,height:260,correctLevel:QRCode.CorrectLevel.M})}
async function qrCenter(){let {data}=await sb.from('students').select('id,first_name,last_name').eq('school_id',currentSchool.id).eq('active',true).order('last_name');$("main").innerHTML=`<div class=card><h2>Centro QR</h2><p>Selecciona un alumno para visualizar su credencial QR.</p><select id=qsel>${(data||[]).map(x=>`<option value="${x.id}">${esc(x.last_name+', '+x.first_name)}</option>`).join('')}</select><button class=primary onclick="showQR(qsel.value)">Generar QR</button></div>`}
async function attendance(){let [{data:cs},{data:ss}]=await Promise.all([sb.from('courses').select('*').eq('school_id',currentSchool.id).eq('active',true),sb.from('subjects').select('*').eq('school_id',currentSchool.id).eq('active',true)]);
$("main").innerHTML=`<div class=card><h2>Tomar asistencia</h2><div class=row><div><label>Curso</label><select id=acourse>${(cs||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>Asignatura</label><select id=asubject><option value="">Sin asignatura</option>${(ss||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>Bloque</label><input id=ablock placeholder="1-2"></div><div><label>Tolerancia atraso (min)</label><input id=alate type=number value=10></div><div><button class=primary onclick="startAttendance()">Iniciar</button></div></div></div>`}
async function startAttendance(){let {data,error}=await sb.from('attendance_sessions').insert({school_id:currentSchool.id,course_id:acourse.value,subject_id:asubject.value||null,teacher_id:session.user.id,block_name:ablock.value.trim(),late_tolerance_minutes:+alate.value||0}).select().single();if(error)return notice(error.message,true);currentAttendance=data;await scanScreen()}
async function scanScreen(){let {data:records}=await sb.from('attendance_records').select('id,status,registered_at,students(first_name,last_name)').eq('session_id',currentAttendance.id);$("main").innerHTML=`<div class=card><h2>Escáner QR</h2><div id=reader></div><div class=row><button class=primary onclick="startScanner()">Activar cámara</button><button onclick="closeAttendance()">Cerrar asistencia</button></div><div id=scanmsg></div></div><div class=card><h3>Registrados: ${(records||[]).length}</h3>${(records||[]).map(r=>`<div class=scanitem><span>${esc(r.students?.first_name+' '+r.students?.last_name)}</span><span class=badge>${esc(r.status)}</span></div>`).join('')}</div>`}
async function startScanner(){if(scanner)return;scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},onScan,()=>{})}
let scanLock=false;async function onScan(text){if(scanLock)return;scanLock=true;setTimeout(()=>scanLock=false,1200);let token=text.startsWith('ASISTIO:')?text.slice(8):text;let {data:student}=await sb.from('students').select('id,first_name,last_name').eq('school_id',currentSchool.id).eq('qr_token',token).eq('active',true).maybeSingle();if(!student){$("scanmsg").innerHTML='<div class="msg error">QR no válido para este colegio.</div>';return}let {data:enrolled}=await sb.from('enrollments').select('id').eq('student_id',student.id).eq('course_id',currentAttendance.course_id).eq('active',true).maybeSingle();if(!enrolled){$("scanmsg").innerHTML='<div class="msg error">El alumno no está matriculado en este curso.</div>';return}
let mins=(Date.now()-new Date(currentAttendance.started_at).getTime())/60000;let status=mins>currentAttendance.late_tolerance_minutes?'late':'present';let {error}=await sb.from('attendance_records').insert({session_id:currentAttendance.id,student_id:student.id,status,registered_at:new Date().toISOString(),method:'qr',registered_by:session.user.id});if(error){scanmsg.innerHTML=`<div class="msg error">${error.code==='23505'?'Alumno ya registrado':esc(error.message)}</div>`;return}scanmsg.innerHTML=`<div class=msg>${esc(student.first_name+' '+student.last_name)} · ${status==='late'?'Atrasado':'Presente'}</div>`}
async function closeAttendance(){if(scanner){try{await scanner.stop()}catch(e){}scanner=null}let {data:enr}=await sb.from('enrollments').select('student_id').eq('course_id',currentAttendance.course_id).eq('active',true);let {data:rec}=await sb.from('attendance_records').select('student_id').eq('session_id',currentAttendance.id);let done=new Set((rec||[]).map(x=>x.student_id));let missing=(enr||[]).filter(x=>!done.has(x.student_id)).map(x=>({session_id:currentAttendance.id,student_id:x.student_id,status:'absent',method:'automatic',registered_by:session.user.id}));if(missing.length)await sb.from('attendance_records').insert(missing);await sb.from('attendance_sessions').update({status:'closed',closed_at:new Date().toISOString()}).eq('id',currentAttendance.id);notice('Asistencia cerrada');currentAttendance=null;history()}
async function history(){let {data,error}=await sb.from('attendance_sessions').select('id,attendance_date,block_name,status,started_at,courses(name),subjects(name),profiles(display_name)').eq('school_id',currentSchool.id).order('started_at',{ascending:false}).limit(100);if(error)return notice(error.message,true);$("main").innerHTML=`<div class="card scroll"><h2>Historial</h2><table><tr><th>Fecha</th><th>Curso</th><th>Asignatura</th><th>Bloque</th><th>Estado</th><th></th></tr>${(data||[]).map(x=>`<tr><td>${x.attendance_date}</td><td>${esc(x.courses?.name)}</td><td>${esc(x.subjects?.name||'')}</td><td>${esc(x.block_name)}</td><td>${esc(x.status)}</td><td><button onclick="sessionDetail('${x.id}')">Ver</button></td></tr>`).join('')}</table></div>`}
async function sessionDetail(id){let {data}=await sb.from('attendance_records').select('status,registered_at,method,notes,students(first_name,last_name,rut)').eq('session_id',id);$("main").innerHTML=`<div class="card scroll"><h2>Detalle de asistencia</h2><button onclick="exportAttendance('${id}')">Exportar Excel</button><table><tr><th>Alumno</th><th>RUT</th><th>Estado</th><th>Hora</th><th>Método</th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.students?.first_name+' '+x.students?.last_name)}</td><td>${esc(x.students?.rut)}</td><td>${esc(x.status)}</td><td>${x.registered_at?new Date(x.registered_at).toLocaleTimeString():''}</td><td>${esc(x.method)}</td></tr>`).join('')}</table></div>`}
async function exportAttendance(id){let {data}=await sb.from('attendance_records').select('status,registered_at,method,students(first_name,last_name,rut)').eq('session_id',id);let rows=(data||[]).map(x=>({RUT:x.students?.rut,Alumno:(x.students?.first_name||'')+' '+(x.students?.last_name||''),Estado:x.status,Hora:x.registered_at?new Date(x.registered_at).toLocaleString():'',Metodo:x.method}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Asistencia');XLSX.writeFile(wb,'Asistio_Asistencia.xlsx')}
async function audit(){if(!['superadmin','admin'].includes(currentRole))return notice('Sin permiso.',true);let {data,error}=await sb.from('audit_logs').select('*').eq('school_id',currentSchool.id).order('created_at',{ascending:false}).limit(100);if(error)return notice(error.message,true);$("main").innerHTML=`<div class="card scroll"><h2>Auditoría</h2><table><tr><th>Fecha</th><th>Acción</th><th>Entidad</th><th>Usuario</th></tr>${(data||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.action)}</td><td>${esc(x.entity_type)}</td><td>${esc(x.user_id)}</td></tr>`).join('')}</table></div>`}
window.addEventListener("error",(e)=>{
  const m=$("loginMsg"); if(m && !$("loginPanel").classList.contains("hidden"))
    m.innerHTML=`<div class="msg error">Error de aplicación: ${esc(e.message)}</div>`;
});
window.addEventListener("unhandledrejection",(e)=>{
  const m=$("loginMsg"); if(m && !$("loginPanel").classList.contains("hidden"))
    m.innerHTML=`<div class="msg error">Error: ${esc(e.reason?.message||e.reason||"desconocido")}</div>`;
});
document.addEventListener("DOMContentLoaded",async()=>{
  $("loginForm").addEventListener("submit",login);
  if(sb){
    const {data,error}=await sb.auth.getSession();
    if(error) $("loginMsg").innerHTML=`<div class="msg error">${esc(error.message)}</div>`;
    else if(data.session) await boot(data.session);
  }
  if("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js");
});
</script></body></html>
